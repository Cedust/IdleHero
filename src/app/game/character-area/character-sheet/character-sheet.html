<div class="sheet">
  <!-- PORTRAIT -->
  <div class="sheet__portrait" [class.sheet__portrait--completed]="IsGameCompleted()">
    <app-icon
      [class.sheet__icon--completed]="IsGameCompleted()"
      [character]="HeroIcon"
      size="4x"></app-icon>
  </div>

  <!-- INFO -->
  <div class="sheet__info">
    <app-info></app-info>
  </div>
</div>
